[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qkmaosjtu/mobile-dev-harness"
authors = ["The mobile-dev-harness contributors"]

[workspace.dependencies]
mdh-core = { path = "crates/mdh-core", version = "0.1.0" }
mdh-driver = { path = "crates/mdh-driver", version = "0.1.0" }
mdh-ui = { path = "crates/mdh-ui", version = "0.1.0" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
which = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
