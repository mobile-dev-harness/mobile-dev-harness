[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qkmaosjtu/mobile-dev-harness"
authors = ["The mobile-dev-harness contributors"]

[workspace.dependencies]
mdh-compat = { path = "crates/mdh-compat", version = "0.1.0" }
mdh-control = { path = "crates/mdh-control", version = "0.1.0" }
mdh-core = { path = "crates/mdh-core", version = "0.1.0" }
mdh-driver = { path = "crates/mdh-driver", version = "0.1.0" }
mdh-mcp = { path = "crates/mdh-mcp", version = "0.1.0" }
mdh-observe = { path = "crates/mdh-observe", version = "0.1.0" }
mdh-perf = { path = "crates/mdh-perf", version = "0.1.0" }
mdh-project = { path = "crates/mdh-project", version = "0.1.0" }
mdh-verify = { path = "crates/mdh-verify", version = "0.1.0" }
mdh-visual = { path = "crates/mdh-visual", version = "0.1.0" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
which = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Image decoding and encoding are ~10x slower unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
