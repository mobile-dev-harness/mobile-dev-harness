name: E2E

# Builds mdh and the sample app, boots an emulator and replays the sample's flows
# (examples/android-sample/.mdh/flows): the verification loop end to end on a real device.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cargo build --release --locked
      - name: Build the sample app
        working-directory: examples/android-sample
        run: ./gradlew assembleDebug
      - name: Replay the sample's flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MDH_PASSWORD: correct-horse
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: examples/android-sample
          script: |
            ../../target/release/mdh devices
            ../../target/release/mdh run
            ../../target/release/mdh flow run login-success login-wrong-password settings-bluetooth compose-greeting messages-scroll --junit flows.xml
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-evidence
          path: |
            examples/android-sample/flows.xml
            examples/android-sample/.mdh/runs/
          if-no-files-found: ignore
