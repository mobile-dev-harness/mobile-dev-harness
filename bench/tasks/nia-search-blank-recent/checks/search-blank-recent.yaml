# Submitting an empty query, or one of spaces, leaves no recent search.
name: search-blank-recent
app: com.google.samples.apps.nowinandroid.demo.debug
setup:
  reset: data
  permissions: [android.permission.POST_NOTIFICATIONS]
steps:
- wait: { target: "What are you interested in?", timeout: 60 }
- tap: Search
- wait: Recent searches
- key: enter
- type: { text: "   ", into: id=searchTextField }
- key: enter
- tap: Clear search text
- wait: Recent searches
assert:
- not visible role=button;text=Clear searches
