name: login-wrong-password
app: dev.mdh.sample
setup:
  reset: data
  open: mdhsample://login
screens:
- LoginActivity
steps:
- type:
    text: alice@example.com
    into: Email
- type:
    text: not-the-password
    into: Password
- tap: id=sign_in
- wait: id=error
assert:
- screen .LoginActivity
- visible id=error
