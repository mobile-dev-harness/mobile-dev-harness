kind: fix
summary: "the system bars are styled once from the system's theme, not from the app's: with the app set to Dark on a light system the status bar icons stay dark"
prompt: |
  System bar icons are dark in dark mode.

  With Dark selected under Settings > Dark mode preference (the phone itself is in light mode) the
  app turns dark, but the clock and the icons in the status bar stay dark as well and can't be read.
