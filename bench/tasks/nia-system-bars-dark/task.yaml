probes:
- after: system-bars-dark
  shell: dumpsys window | grep mLastAppearance
  lacks:
  - LIGHT_STATUS_BARS
  expect: light status bar icons while the app is dark
- after: system-bars-light
  shell: dumpsys window | grep mLastAppearance
  contains:
  - LIGHT_STATUS_BARS
  expect: dark status bar icons while the app is light
