        fun onSearchTriggered(query: String) {
            if (query.isBlank()) return
            viewModelScope.launch {
                recentSearchRepository.insertOrReplaceRecentSearch(searchQuery = query)
            }
            analyticsHelper.logEventSearchTriggered(query = query)
        }
  replace: |2
        fun onSearchTriggered(query: String) {
            val trimmed = query.trim()
            if (trimmed.isEmpty()) return
            viewModelScope.launch {
                recentSearchRepository.insertOrReplaceRecentSearch(searchQuery = trimmed)
            }
            analyticsHelper.logEventSearchTriggered(query = trimmed)
        }
