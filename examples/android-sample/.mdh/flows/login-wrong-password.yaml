name: login-wrong-password
app: dev.mdh.sample
setup:
  reset: data
  open: mdhsample://login
screens:
- LoginActivity
steps:
- assert:
  - disabled id=sign_in
- type:
    text: alice@example.com
    into: Email
- type:
    text: not-the-password
    into: Password
- tap: id=sign_in
assert:
- screen .LoginActivity
- visible id=error
- enabled id=sign_in
